<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1726">
<title>螢火蟲夜遊｜腦健康快篩</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Night garden: one fixed full-screen stage, ambient fireflies on canvas, task panel floating over it, glow accent for everything that rewards. */
:root{--night:#0d1726;--night2:#101d31;--panel:#14233a;--line:#2a3d5c;--ink:#eef3ea;--muted:#a9b6c6;--glow:#e8f46a;--glow2:#f4fb8a;--warn:#f5a524;--bad:#f0655a;--good:#7bd389;--font:"Noto Sans TC",system-ui,"Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--night);color:var(--ink);font-family:var(--font);font-size:22px;line-height:1.5;color-scheme:dark}
[hidden]{display:none!important}
body{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.wrap{max-width:760px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
h1{font-size:40px;margin:0;line-height:1.15;font-weight:900;text-wrap:balance}
h1 span{color:var(--glow)}
h2{font-size:30px;margin:0;line-height:1.3;font-weight:700;text-wrap:balance}
h3{margin:0;font-size:18px;color:var(--muted);font-weight:500;letter-spacing:.06em}
p{margin:0}
.lede{font-size:20px;color:#d6dee8}
.note{font-size:15px;color:var(--muted);line-height:1.5}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.warnbox{background:rgba(245,165,36,.12);border:1px solid var(--warn);border-radius:12px;padding:12px 14px;font-size:15px}
.btn{font:inherit;font-size:26px;font-weight:700;min-height:80px;padding:12px 18px;border-radius:16px;border:2px solid var(--line);background:var(--night2);color:var(--ink);cursor:pointer;width:100%;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.btn.primary{background:var(--glow);border-color:var(--glow);color:#1a2410;font-size:30px;min-height:92px;box-shadow:0 0 24px rgba(232,244,106,.35)}
.btn.quiet{font-size:20px;font-weight:500;color:var(--muted);min-height:60px;background:transparent}
.btn.picked{background:rgba(232,244,106,.18);border-color:var(--glow);box-shadow:0 0 16px rgba(232,244,106,.3)}
.btn.vcard{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;min-height:0;padding:16px 18px}
.btn.vcard b{font-size:26px} .btn.vcard span{font-size:17px;font-weight:400;color:var(--muted);line-height:1.4}
.tag{font-size:14px;color:var(--glow);border:1px solid var(--glow);border-radius:999px;padding:1px 10px;margin-left:8px;font-weight:500;vertical-align:middle}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.grid.cols2{grid-template-columns:repeat(2,1fr)} .grid.cols3{grid-template-columns:repeat(3,1fr)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:16px;color:var(--muted)}
input{background:var(--night);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:22px;width:100%;min-height:60px}
input:focus-visible{outline:3px solid var(--glow);outline-offset:1px}
/* stage */
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none}
#scrGame{position:fixed;inset:0;display:flex;flex-direction:column;z-index:2}
.hud{display:flex;justify-content:space-between;align-items:center;padding:calc(6px + env(safe-area-inset-top,0px)) 14px 4px;font-size:15px;color:var(--muted);gap:8px}
.hudSide{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.lamps{display:flex;gap:5px} .lamps i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block} .lamps i.on{background:var(--glow);box-shadow:0 0 8px var(--glow)}
#hudScore{font-size:56px;font-weight:900;line-height:1;color:var(--glow);text-shadow:0 0 16px rgba(232,244,106,.45);font-variant-numeric:tabular-nums}
#hudScore.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.25)}}
.hud button{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:15px;min-height:34px}
#stage{flex:1;position:relative;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
#task{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-height:100%;justify-content:center}
#pts{position:fixed;left:16px;top:28%;font-size:52px;font-weight:900;color:var(--glow);text-shadow:0 0 18px rgba(232,244,106,.6);pointer-events:none;opacity:0;z-index:5}
#pts.fly{animation:fly 1.1s ease-out}
@keyframes fly{0%{opacity:0;transform:translateY(20px) scale(.6)}20%{opacity:1;transform:scale(1.3)}100%{opacity:0;transform:translateY(-120px) scale(1)}}
#fb{position:fixed;left:0;right:0;top:16%;text-align:center;font-size:30px;font-weight:900;color:var(--glow);text-shadow:0 0 14px rgba(232,244,106,.5);pointer-events:none;opacity:0;z-index:5;transition:opacity .2s}
#fb.show{opacity:1}
.stim{font-size:140px;line-height:1;text-align:center;min-height:170px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 18px rgba(232,244,106,.35))}
.words{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.word{font-size:36px;font-weight:900;padding:16px 22px;border:2px solid var(--glow);border-radius:16px;background:rgba(232,244,106,.08);text-align:center;min-width:160px;box-shadow:0 0 22px rgba(232,244,106,.25)}
.word small{display:block;font-size:52px;line-height:1.1}
.timer{font-size:16px;color:var(--muted);text-align:right}
.trail{position:relative;width:100%;aspect-ratio:1/0.75;background:rgba(20,35,58,.6);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.trail svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;border:3px solid var(--line);background:var(--night2);font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.node.done{background:var(--glow);color:#1a2410;border-color:var(--glow);box-shadow:0 0 26px var(--glow)}
.node.wrong{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.clocks{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.clocks .btn{padding:10px;min-height:0;color:var(--glow2)} .clocks svg{width:100%;height:auto;display:block}
body[data-v=std] .clocks{grid-template-columns:repeat(3,1fr)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px} .pad .btn{min-height:64px}
.entry{font-size:44px;font-weight:900;letter-spacing:.3em;text-align:center;min-height:66px;border-bottom:3px solid var(--line);color:var(--glow)}
#catch{position:relative;width:100%;height:min(46vh,360px);border-radius:16px;overflow:hidden;background:rgba(20,35,58,.5);border:1px solid var(--line)}
#catch canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.score{font-size:72px;font-weight:900;line-height:1;text-align:center;color:var(--glow);text-shadow:0 0 22px rgba(232,244,106,.5);font-variant-numeric:tabular-nums}
.band{padding:14px;border-radius:12px;font-size:22px;font-weight:700;text-align:center;border:1px solid}
.band.good{color:var(--good);border-color:var(--good);background:rgba(123,211,137,.1)} .band.warn{color:var(--warn);border-color:var(--warn);background:rgba(245,165,36,.1)} .band.bad{color:var(--bad);border-color:var(--bad);background:rgba(240,101,90,.1)}
.gauge{display:flex;flex-direction:column;gap:8px}
.gauge .pct{font-size:36px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.gauge .pct small{font-size:16px;font-weight:500;color:var(--muted);margin-left:8px}
.gauge .track{position:relative;height:16px;border-radius:999px;background:linear-gradient(90deg,rgba(123,211,137,.5),rgba(245,165,36,.5) 50%,rgba(240,101,90,.6));border:1px solid var(--line)}
.gauge .mark{position:absolute;top:-6px;width:6px;height:28px;margin-left:-3px;background:var(--ink);border-radius:3px}
.gauge .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left} td:last-child,th:last-child{text-align:right;white-space:nowrap}
.rec{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.rec .n{flex:1;min-width:0;font-weight:700;font-size:20px} .rec .d{font-size:15px;color:var(--muted);font-weight:400;display:block}
.rec .s{font-size:22px;font-weight:900;color:var(--glow);white-space:nowrap}
.dot{width:12px;height:12px;border-radius:50%;flex:none} .dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.chips{display:flex;gap:8px;flex-wrap:wrap} .chips .btn{width:auto;min-height:42px;font-size:17px;padding:4px 14px;font-weight:500;border-radius:999px}
.row{display:flex;gap:10px;flex-wrap:wrap} .row .btn{flex:1;min-width:140px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--glow);color:#1a2410;padding:10px 20px;border-radius:999px;font-size:18px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){html,body{font-size:20px} h1{font-size:32px} .word{font-size:30px;min-width:0;flex:1} .stim{font-size:110px;min-height:130px} .node{width:70px;height:70px;margin:-35px 0 0 -35px;font-size:28px} #hudScore{font-size:44px} .fields{grid-template-columns:1fr} .clocks{grid-template-columns:1fr} body[data-v=std] .clocks{grid-template-columns:1fr 1fr}}
</style></head><body>
<canvas id="bg"></canvas>
<section id="scrIntro" class="wrap"></section>
<section id="scrGame" hidden>
  <div class="hud"><div class="hudSide"><span id="hudPhase"></span><div class="lamps" id="lamps"></div></div><div id="hudScore">0</div><div class="hudSide" style="align-items:flex-end;flex-direction:row;justify-content:flex-end;gap:6px"><button type="button" id="btnVoice" aria-label="語音">🔊 語音</button><button type="button" id="btnMusic" aria-label="配樂">♪ 開</button></div></div>
  <div id="stage"><div id="task"></div></div>
</section>
<div id="pts"></div><div id="fb"></div><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
// ===== 設定：Google Apps Script 網頁應用程式網址 =====
const SHEET_URL='https://script.google.com/macros/s/AKfycbzCQUiChcu5FGWJqYquAbnWkwVJgGxmZGEkHde2UbGtKypMjaDFxzF9EPxjiXURAuQeyA/exec';
const $=s=>document.querySelector(s);
const intro=$('#scrIntro'), game=$('#scrGame'), task=$('#task');
let V=null, state=null, lock=0, timerId=null, speaking=true, score=0;
const VERSIONS={
  std:   {key:'std',   name:'標準版', total:30, steps:9, mid:23.5, k:0.75, cut:[27,24], mins:'約 4 分鐘', who:'65 到 75 歲、視力與手部動作尚可', desc:'九站、多選題，完整走一趟夜間花園。', guard:450},
  senior:{key:'senior',name:'樂齡版', total:22, steps:6, mid:15.5, k:1.0,  cut:[19,16], mins:'約 3 分鐘', who:'80 歲以上或體弱長者', desc:'六站、全部二選一、大字大按鈕、節奏慢。', guard:600},
  quick: {key:'quick', name:'極速版', total:18, steps:6, mid:11.5, k:1.1,  cut:[15,12], mins:'約 2 分鐘', who:'專注力有限、需要最短時間', desc:'六站、二選一，偏重記憶與注意力。', guard:600}
};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuffle(a).slice(0,n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1400)}
function speak(t){ if(!speaking||!t) return; try{ const u=new SpeechSynthesisUtterance(t); u.lang='zh-TW'; u.rate=V&&V.key==='std'?.9:.8; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }
function guard(fn){return function(ev){const now=Date.now();if(now-lock<(V?V.guard:450))return;lock=now;fn.call(this,ev)}}
function clearTimer(){if(timerId){clearTimeout(timerId);timerId=null}}
function deadline(ms,onTimeout){clearTimer();timerId=setTimeout(()=>{timerId=null;onTimeout()},ms)}
function btn(label,cls,id){return `<button type="button" class="btn ${cls||''}" ${id?`id="${id}"`:''}>${esc(label)}</button>`}
function setV(key){V=VERSIONS[key]||null;document.body.dataset.v=V?V.key:''}
function showIntro(html,say){game.hidden=true;intro.hidden=false;intro.innerHTML=html;window.scrollTo(0,0);speak(say)}
function showTask(html,say){intro.hidden=true;game.hidden=false;task.innerHTML=html;$('#stage').scrollTop=0;speak(say)}
function setStep(n,label){$('#hudPhase').textContent=label;$('#lamps').innerHTML=Array.from({length:V.steps},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}

// ===== 音效與配樂（Web Audio 即時產生，無檔案） =====
const Audio=(()=>{let ctx=null,master=null,playing=false,muted=false,timer=0,last=3;const SCALE=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];
  function ensure(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;if(!ctx){ctx=new AC();master=ctx.createGain();master.gain.value=.16;master.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume();return true}
  function tone(f,when,len,vol,type){const o=ctx.createOscillator(),e=ctx.createGain();o.type=type||'sine';o.frequency.value=f;e.gain.setValueAtTime(0,when);e.gain.linearRampToValueAtTime(vol,when+Math.min(.4,len*.2));e.gain.exponentialRampToValueAtTime(.0001,when+len);o.connect(e);e.connect(master);o.start(when);o.stop(when+len+.05)}
  function step(){if(!playing)return;last=Math.max(0,Math.min(SCALE.length-1,last+Math.floor(Math.random()*5)-2));const t=ctx.currentTime+.05;tone(SCALE[last],t,2.6,.5);if(Math.random()<.35)tone(SCALE[last]/2,t,4.2,.32);timer=setTimeout(step,900+Math.random()*1300)}
  return {
    start(){if(!ensure())return;clearTimeout(timer);playing=true;master.gain.setValueAtTime(muted?0:.16,ctx.currentTime);step()},
    stop(){playing=false;clearTimeout(timer);if(ctx)master.gain.setValueAtTime(0,ctx.currentTime)},
    toggle(){muted=!muted;if(ctx)master.gain.setValueAtTime(muted?0:.16,ctx.currentTime);return !muted},
    good(){if(!ensure()||muted)return;const t=ctx.currentTime;tone(659.25,t,.35,.9);tone(880,t+.12,.5,.9)},
    big(){if(!ensure()||muted)return;const t=ctx.currentTime;[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*.1,.6,.8))},
    soft(){if(!ensure()||muted)return;tone(220,ctx.currentTime,.25,.5,'triangle')},
    tick(){if(!ensure()||muted)return;tone(1200,ctx.currentTime,.06,.3)}
  }})();
$('#btnMusic').addEventListener('click',()=>{$('#btnMusic').textContent=Audio.toggle()?'♪ 開':'♪ 關'});
$('#btnVoice').addEventListener('click',()=>{speaking=!speaking;$('#btnVoice').textContent=speaking?'🔊 語音':'🔇 語音';if(!speaking){try{speechSynthesis.cancel()}catch(e){}}});

// ===== 背景：星空與漫遊的螢火蟲 =====
const bg=$('#bg'),bgc=bg.getContext('2d');let flies=[],stars=[],burst=[];
function fitBg(){const d=window.devicePixelRatio||1;bg.width=innerWidth*d;bg.height=innerHeight*d;bgc.setTransform(d,0,0,d,0,0);
  stars=Array.from({length:70},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight*.7,r:.6+Math.random()*1.4,p:Math.random()*6}));
  flies=Array.from({length:9},()=>({x:Math.random()*innerWidth,y:innerHeight*.3+Math.random()*innerHeight*.6,a:Math.random()*6.3,s:.25+Math.random()*.4,p:Math.random()*6}))}
addEventListener('resize',fitBg);fitBg();
function drawFirefly(c,x,y,now,scale){const flap=Math.sin(now/40),pulse=.85+.15*Math.sin(now/260+x);c.save();c.translate(x,y);c.scale(scale,scale);
  const tg=c.createRadialGradient(-13,2,1,-13,2,30*pulse);tg.addColorStop(0,'rgba(232,244,106,.95)');tg.addColorStop(1,'rgba(232,244,106,0)');c.fillStyle=tg;c.beginPath();c.arc(-13,2,30*pulse,0,7);c.fill();
  c.fillStyle='rgba(205,225,245,.5)';c.strokeStyle='rgba(235,245,255,.7)';c.lineWidth=1;[[.55,0],[1.0,-3]].forEach(([a,dx])=>{c.save();c.translate(dx+2,-4);c.rotate(a+flap*.38);c.beginPath();c.ellipse(-11,0,12,4.5,0,0,7);c.fill();c.stroke();c.restore()});
  c.fillStyle='#f4fb8a';c.beginPath();c.ellipse(-11,1.5,8,5,0,0,7);c.fill();c.fillStyle='#2c241b';c.beginPath();c.ellipse(1,0,8,5.5,0,0,7);c.fill();c.fillStyle='#d9662b';c.beginPath();c.ellipse(9,-.5,4.5,5,0,0,7);c.fill();c.fillStyle='#14100c';c.beginPath();c.arc(13,-.5,3,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(14,-1.5,1,0,7);c.fill();
  c.strokeStyle='#c8b48e';c.lineWidth=1.2;[[21,-9],[23,-4]].forEach(([ax,ay])=>{c.beginPath();c.moveTo(14,-3);c.quadraticCurveTo(18,-7,ax,ay);c.stroke()});c.restore()}
function drawBg(now){const W=innerWidth,H=innerHeight;bgc.clearRect(0,0,W,H);
  const sky=bgc.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0b1422');sky.addColorStop(1,'#132a3a');bgc.fillStyle=sky;bgc.fillRect(0,0,W,H);
  stars.forEach(s=>{bgc.globalAlpha=.4+.5*Math.abs(Math.sin(now/900+s.p));bgc.fillStyle='#eef3ea';bgc.beginPath();bgc.arc(s.x,s.y,s.r,0,7);bgc.fill()});bgc.globalAlpha=1;
  bgc.fillStyle='#0a1a22';bgc.beginPath();bgc.moveTo(0,H);for(let x=0;x<=W;x+=40)bgc.lineTo(x,H*.86+Math.sin(x/90)*10+Math.sin(x/37)*5);bgc.lineTo(W,H);bgc.fill();
  flies.forEach(f=>{f.a+=(Math.random()-.5)*.25;f.x+=Math.cos(f.a)*f.s;f.y+=Math.sin(f.a)*f.s*.6;if(f.x<-30)f.x=W+30;if(f.x>W+30)f.x=-30;if(f.y<H*.2)f.a=1;if(f.y>H*.95)f.a=-1;
    const g=bgc.createRadialGradient(f.x,f.y,0,f.x,f.y,14);const al=.35+.45*Math.abs(Math.sin(now/500+f.p));g.addColorStop(0,`rgba(232,244,106,${al})`);g.addColorStop(1,'rgba(232,244,106,0)');bgc.fillStyle=g;bgc.beginPath();bgc.arc(f.x,f.y,14,0,7);bgc.fill()});
  burst=burst.filter(b=>now<b.t0+b.life);burst.forEach(b=>{const k=(now-b.t0)/b.life;const x=b.x+Math.cos(b.a)*b.v*k*160,y=b.y+Math.sin(b.a)*b.v*k*160-k*k*60;bgc.globalAlpha=1-k;drawFirefly(bgc,x,y,now,.7+b.v*.3);bgc.globalAlpha=1});
  requestAnimationFrame(drawBg)}
requestAnimationFrame(drawBg);
function sparkle(n){const x=innerWidth/2,y=innerHeight*.45;for(let i=0;i<n;i++)burst.push({x,y,a:-Math.PI/2+(Math.random()-.5)*2.2,v:.5+Math.random(),t0:performance.now(),life:900+Math.random()*500})}

const sections=[];
function addScore(name,got,max,note){sections.push({name,got:Math.max(0,Math.min(max,got)),max,note:note||''})}
function probImpair(v,s,recall){const logit=-v.k*(s-v.mid)+(recall<4?1.0:0);return 1/(1+Math.exp(-logit))}
function probLevel(p){return p<.1?'很低':p<.25?'偏低':p<.5?'中等':p<.75?'偏高':'很高'}
function gaugeHtml(p){const pct=Math.round(p*100);return `<div class="gauge"><div class="pct">${pct}%<small>需要進一步腦健康評估的可能性（估計）：${probLevel(p)}</small></div><div class="track"><span class="mark" style="left:${pct}%"></span></div><div class="lab"><span>0%</span><span>50%</span><span>100%</span></div></div>`}

const svgClock=(h,m)=>{const ha=(h%12)*30+m*.5,ma=m*6;const hand=(a,l,w)=>`<line x1="50" y1="50" x2="${(50+l*Math.sin(a*Math.PI/180)).toFixed(1)}" y2="${(50-l*Math.cos(a*Math.PI/180)).toFixed(1)}" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"/>`;let ticks='';for(let i=1;i<=12;i++){const a=i*30*Math.PI/180;ticks+=`<text x="${(50+38*Math.sin(a)).toFixed(1)}" y="${(50-38*Math.cos(a)+4).toFixed(1)}" font-size="12" text-anchor="middle" fill="currentColor" font-weight="700">${i}</text>`}
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47" fill="rgba(232,244,106,.06)" stroke="currentColor" stroke-width="2.5"/>${ticks}${hand(ha,22,5)}${hand(ma,32,3)}<circle cx="50" cy="50" r="2.5" fill="currentColor"/></svg>`};

// 抓螢火蟲（go/no-go）：Canvas 動畫，螢火蟲飛進來就按，飛蛾與蝙蝠不要按
async function catchGame(n,nt,isPractice,showMs,gapMs){
  const seq=shuffle(Array.from({length:n},(_,i)=>i<nt?'fly':['moth','bat','moth'][i%3]));let hits=0,fa=0,pressed=false,cur=null,t0=0;
  showTask(`<h2>${isPractice?'先練習：':''}螢火蟲飛進來就按「抓！」</h2><p class="note" style="font-size:18px">飛蛾 🦋 和蝙蝠 🦇 不要按。</p><div id="catch"><canvas id="cc"></canvas></div>${btn('抓！','primary','go')}`,isPractice?'先練習。螢火蟲飛進來就按抓，飛蛾和蝙蝠不要按。':'正式開始。螢火蟲飛進來就按抓。');
  const box=$('#catch'),cc=$('#cc'),c=cc.getContext('2d');const fit=()=>{const r=box.getBoundingClientRect(),d=devicePixelRatio||1;cc.width=r.width*d;cc.height=r.height*d;c.setTransform(d,0,0,d,0,0);return r};let R=fit();
  let caught=false;$('#go').addEventListener('click',()=>{if(cur&&!pressed){pressed=true;if(cur==='fly'){caught=true;Audio.good();sparkle(3)}else Audio.soft()}});
  let alive=true;(function loop(now){if(!alive||!document.body.contains(cc))return;R=fit();const W=R.width,H=R.height;c.clearRect(0,0,W,H);
    if(cur){const k=Math.min(1,(now-t0)/showMs);const x=W*.1+(W*.8)*(caught?Math.min(1,k*1.6):k*.5+.25*Math.sin(k*3)),y=H*.5+Math.sin(now/300)*18;
      if(cur==='fly'){drawFirefly(c,x,y,now,caught?1.9:1.6);if(caught){const g=c.createRadialGradient(x,y,0,x,y,60);g.addColorStop(0,'rgba(232,244,106,.5)');g.addColorStop(1,'rgba(232,244,106,0)');c.fillStyle=g;c.beginPath();c.arc(x,y,60,0,7);c.fill()}}
      else{c.font='80px serif';c.textAlign='center';c.textBaseline='middle';c.fillText(cur==='moth'?'🦋':'🦇',x,y)}}
    requestAnimationFrame(loop)})(performance.now());
  await sleep(1800);
  for(const s of seq){pressed=false;caught=false;cur=s;t0=performance.now();await sleep(showMs);if(!document.body.contains(cc)){alive=false;return null}
    if(s==='fly'){if(pressed)hits++}else if(pressed)fa++;cur=null;await sleep(gapMs)}
  alive=false;return {hits,fa,nt,nn:n-nt};
}
// 點亮燈籠（連線）
function trail(labels,instr,ms,maxErr){return new Promise(res=>{const pts=[];let tries=0;const gap=V.key==='std'?20:26;
  while(pts.length<labels.length&&tries++<3000){const x=14+Math.random()*72,y=16+Math.random()*48;if(pts.every(p=>Math.hypot(p.x-x,(p.y-y)*1.3)>gap))pts.push({x,y})}
  while(pts.length<labels.length)pts.push({x:15+pts.length*14,y:40});let next=0,err=0,path=[];
  showTask(`<h2>${instr}</h2><div class="trail" id="tr"><svg viewBox="0 0 100 75" preserveAspectRatio="none"><polyline id="pl" fill="none" stroke="#e8f46a" stroke-width="1.2" stroke-linecap="round" points=""/></svg>${labels.map((l,i)=>`<div class="node" data-i="${i}" style="left:${pts[i].x}%;top:${pts[i].y/0.75}%">${esc(l)}</div>`).join('')}</div><p class="note" style="font-size:18px">點錯沒關係，再點正確的那一個。燈籠會一盞一盞亮起來。</p>`,instr);
  const done=t=>{clearTimer();res({err,timeout:t,finished:next>=labels.length})};
  $('#tr').addEventListener('click',guard(e=>{const n=e.target.closest('.node');if(!n)return;const i=+n.dataset.i;
    if(i===next){n.classList.add('done');path.push(pts[i].x+','+pts[i].y);$('#pl').setAttribute('points',path.join(' '));Audio.tick();next++;if(next>=labels.length){Audio.big();sparkle(6);setTimeout(()=>done(false),500)}}
    else{err++;Audio.soft();n.classList.remove('wrong');void n.offsetWidth;n.classList.add('wrong');if(err>=maxErr)done(false)}}));
  deadline(ms,()=>done(true))})}
function clockQ(h,m,opts,label,ms){return new Promise(res=>{const ai=opts.findIndex(o=>o[2]);
  showTask(`<h2>樹上的燈籠鐘，哪一個是 <span style="color:var(--glow)">${label}</span>？</h2><div class="clocks" id="c">${opts.map((o,i)=>`<button type="button" class="btn" data-i="${i}">${svgClock(o[0],o[1])}</button>`).join('')}</div>${btn('不確定','quiet','dk')}`,'哪一個時鐘是'+label+'？');

async function flowEasy(){const q=V.key==='quick',w=state.words,foils=pick(WORDPOOL.filter(x=>!w.includes(x)),3),T=q?30000:60000;
  await station(1,'寶物登錄','螢火蟲在花園入口等您，牠帶來三樣寶物。');if(!await registerWords(w,q?8:12))return;
  {let got=0,note=[];for(let i=0;i<3;i++){const r=await twoChoice('剛才有哪一個？',{html:wordCard(w[i])},{html:wordCard(foils[i])},'剛才有哪一個？'+w[i][0]+'，還是'+foils[i][0]+'？',T);if(r==='hit')got++;addPoints(r==='hit'?1:0);tmark(r,note)}addScore('即時記憶',got,3,note.join(' '))}
  await station(2,'抬頭看星空','從星空和月亮，猜猜現在的時間。');{const Q=orientQs();const list=q?[Q.tod,Q.weekday]:[Q.tod,Q.season,Q.weekday];let got=0,note=[];for(const it of list){const r=await multiChoice(esc(it.q),it.opts.map(esc),it.ans,it.q,T,'cols2');if(r==='hit')got++;addPoints(r==='hit'?1:0);tmark(r,note)}addScore('定向感',got,list.length,note.join(' '))}
  await station(3,'抓螢火蟲','草叢裡會飛出各種小蟲，只抓螢火蟲。');{const p=await catchGame(q?3:4,q?1:2,true,2200,600);if(!p)return;showTask(`<h2>練習結束，正式開始</h2><p class="lede">一樣，看到螢火蟲才按。</p>${btn('開始','primary','s')}`,'練習結束，正式開始。');await new Promise(r=>$('#s').addEventListener('click',guard(r)));
   const r=await catchGame(q?8:12,q?3:5,false,2200,600);if(!r)return;const s=Math.round(3*Math.max(0,r.hits/r.nt-r.fa/r.nn));addPoints(s,`抓到 ${r.hits} 隻！`);addScore('注意力',s,3,`命中 ${r.hits}/${r.nt}，誤按 ${r.fa}`)}
  await station(4,'燈籠鐘','樹上掛著燈籠鐘，找出正確的時間。');{let got=0,note=[];for(const [h,m] of pick(CLOCK_EASY,q?1:2)){const wr=[(h+4)%12||12,m];const opts=shuffle([[h,m,true],[wr[0],wr[1],false]]);const label=m===0?`${h} 點整`:`${h} 點半`;const r=await clockQ(h,m,opts,label,T);if(r==='hit')got++;addPoints(r==='hit'?(q?2:1):0);tmark(r,note)}addScore('時鐘辨認',q?got*2:got,2,note.join(' '))}
  await station(5,'點亮燈籠','照順序點亮小路上的五盞燈籠。');{const a=await trail(['1','2','3','4','5'],'請照順序點亮 1、2、3、4、5',q?45000:75000,5);let s=!a.finished?0:a.err<=1?2:a.err<=3?1:0;let note=`錯誤 ${a.err}`;if(a.timeout){state.timeouts++;note+=' 逾時'}addPoints(s);addScore('執行功能（連線）',s,2,note)}
  if(!q){await station(6,'動物與回家','花園裡的動物探出頭來，然後就要回家了。');let got=0,note=[];for(const it of pick(NAMEPOOL,3)){const foil=pick(NAMEPOOL.filter(x=>x!==it),1)[0];const r=await twoChoice(`<div class="stim">${it[0]}</div>這是什麼動物？`,{html:esc(it[1])},{html:esc(foil[1])},'這是什麼動物？',T);if(r==='hit')got++;addPoints(r==='hit'?1:0);tmark(r,note)}addScore('命名',got,3,note.join(' '))}
  else await station(6,'寶物回家','回到花園入口了，想想一開始的三樣寶物。');
  {const f2=pick(WORDPOOL.filter(x=>!w.includes(x)&&!foils.includes(x)),3);let hit=0,dk=0,note=[];
   showTask(`<h2>還記得一開始的三樣寶物嗎？</h2><p class="lede">接下來每題兩個選一個。想不起來可以按「不確定」。</p>${btn('好，開始','primary','s')}`,'還記得一開始的三樣寶物嗎？接下來每題兩個選一個。');await new Promise(r=>$('#s').addEventListener('click',guard(r)));
   for(let i=0;i<3;i++){const r=await twoChoice('一開始的寶物，是哪一個？',{html:wordCard(w[i])},{html:wordCard(f2[i])},'一開始的寶物，是哪一個？'+w[i][0]+'，還是'+f2[i][0]+'？',T);if(r==='hit')hit++;else if(r==='dk')dk++;addPoints(r==='hit'?2:0);tmark(r,note)}
   addScore('延遲回憶',hit*2,6,`記得 ${hit}/3`+(dk?`，不確定 ${dk}`:'')+(note.length?' 逾時':''))}
  result();}

// ================= 首頁 / 開始 / 結果 / 記錄 =================
function home(){setV(null);state=null;Audio.stop();
  showIntro(`<header style="display:flex;flex-direction:column;gap:8px"><h1>螢火蟲夜遊<span>.</span></h1><p class="lede">跟著螢火蟲走一趟夜間花園：記住寶物、看星空、抓螢火蟲、點亮燈籠，最後把寶物帶回家。全程只要用手指點按。</p><p class="note">篩檢用途，不應作為診斷依據，詳情請洽專業人員</p></header>
  <div class="panel"><h3>選一個版本</h3><div class="grid" style="grid-template-columns:1fr" id="vs">${Object.values(VERSIONS).map(v=>`<button type="button" class="btn vcard" data-v="${v.key}"><b>${v.name}<span class="tag">${v.mins}</span></b><span>適合：${v.who}</span><span>${v.desc}</span></button>`).join('')}</div></div>
  <div class="row">${btn('查看所有受試者記錄','quiet','recs')}</div>
  <div class="warnbox"><b>這是篩檢遊戲：</b>分數與「需要進一步評估的可能性」是依門檻推估的參考值，尚未以臨床樣本校正，不是診斷。建議由家人或工作人員陪同進行。</div>`,'螢火蟲夜遊。請選擇版本。');
  $('#vs').addEventListener('click',guard(e=>{const b=e.target.closest('.btn');if(b){location.hash=b.dataset.v;start(b.dataset.v)}}));$('#recs').addEventListener('click',guard(()=>{location.hash='records';records()}))}
function start(key){setV(key);state=null;
  showIntro(`<header style="display:flex;flex-direction:column;gap:8px"><h1>${V.name}<span>.</span><span class="tag">${V.mins}</span></h1><p class="lede">${V.desc}</p><p class="note">請家人或工作人員陪同，可以替長輩唸題目，但不要提示答案。遊戲中右上角可開關語音與配樂。</p></header>
  <form id="form" class="panel"><h3>受試者資料</h3><div class="fields"><label class="field">姓名或代號（必填）<input id="pname" maxlength="30" autocomplete="off" placeholder="例如：王阿公、A03"></label><label class="field">年齡（可不填）<input id="page" type="number" min="40" max="120" inputmode="numeric" placeholder="歲"></label></div>
  <h3>教育程度（按下即出發）</h3><div class="grid cols2" id="edu">${btn('小學以下（6 年以下）','primary')}${btn('國中以上','primary')}</div></form>
  <div class="row">${btn('換版本','quiet','back')}${btn('查看記錄','quiet','recs')}</div>`,V.name+'。請填寫受試者姓名，再選擇教育程度出發。');
  $('#form').addEventListener('submit',e=>e.preventDefault());$('#back').addEventListener('click',guard(()=>{location.hash='';home()}));$('#recs').addEventListener('click',guard(()=>{location.hash='records';records()}));
  $('#edu').querySelectorAll('.btn').forEach((b,i)=>b.addEventListener('click',guard(()=>{const name=$('#pname').value.trim();if(!name){toast('請先填寫受試者姓名或代號');$('#pname').focus();return}const age=parseInt($('#page').value,10);
    state={v:V.key,name,age:isNaN(age)?null:age,edu:i===0?'low':'high',start:Date.now(),timeouts:0,words:pick(WORDPOOL,3)};sections.length=0;score=0;$('#hudScore').textContent='0';Audio.start();(V.key==='std'?flowStd:flowEasy)()})))}
function result(){Audio.big();sparkle(14);
  const raw=sections.reduce((a,s)=>a+s.got,0),adj=raw+(state.edu==='low'&&raw<V.total?1:0),mins=Math.round((Date.now()-state.start)/6000)/10,recall=sections.find(s=>s.name==='延遲回憶').got;
  let band,cls,advice;
  if(adj>=V.cut[0]&&recall>=4){band='目前未見明顯異常';cls='good';advice='建議每年再玩一次。若家人察覺記憶或生活功能明顯退步，仍請就醫。'}
  else if(adj>=V.cut[1]){band='建議追蹤觀察';cls='warn';advice='分數接近警戒值。建議 3 至 6 個月後再玩一次，並留意日常是否有重複發問、迷路、忘記約定等情形。'}
  else{band='建議至記憶門診或神經內科進一步評估';cls='bad';advice='此結果不代表確診，但值得請專業人員做完整評估（例如 MoCA、MMSE 與相關檢查）。'}
  if(state.timeouts>=(V.key==='std'?3:2))advice+='　本次有多題逾時，可能受聽力、視力或專注狀況影響，解讀時請一併考量。';
  const prob=probImpair(V,adj,recall),d=new Date(),stamp=`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  const rec={v:V.key,vname:V.name,name:state.name,age:state.age,edu:state.edu,score:adj,raw,total:V.total,band,cls,prob:Math.round(prob*1000)/1000,mins,timeouts:state.timeouts,sections:sections.map(s=>({name:s.name,got:s.got,max:s.max,note:s.note})),ts:Date.now(),stamp};
  saveRecord(rec).then(r=>{const el=$('#saved');if(el)el.textContent=r.where==='shared'?'已存入共用試算表':r.where==='failed'?'試算表寫入失敗（'+(r.why||'')+'），已暫存在這台裝置，請用「複製結果」另外保留':'已存在這台裝置'});
  state=null;
  showIntro(`<header><h1>${esc(rec.name)} 回家了<span>.</span><span class="tag">${V.name}</span></h1></header>
  <div class="panel"><div class="score">${adj} <span style="font-size:26px;color:var(--muted)">/ ${V.total}</span></div><div class="band ${cls}">${band}</div>${gaugeHtml(prob)}<p class="lede">${esc(advice)}</p></div>
  <div class="panel"><table><tr><th>站</th><th></th><th>得分</th></tr>${sections.map(s=>`<tr><td>${esc(s.name)}</td><td class="note">${esc(s.note)}</td><td>${s.got} / ${s.max}</td></tr>`).join('')}</table>
  <p class="note">用時 ${mins} 分鐘，逾時 ${state?0:rec.timeouts} 次${adj!==raw?'，教育程度校正 +1 分':''}。判讀門檻偏向高敏感度（${V.cut[0]} 分以下即提示追蹤），延遲回憶低於 4 分會單獨降級。「需要進一步評估的可能性」是依本版門檻推估的參考值，尚未以臨床樣本校正。</p><p class="note" id="saved">儲存中…</p></div>
  <div class="row">${btn('複製結果','','cp')}${btn('測下一位','primary','again')}</div><div class="row">${btn('回首頁','quiet','home')}${btn('查看記錄','quiet','recs')}</div>
  <p class="note">本工具為篩檢遊戲，不是醫療診斷，也不能取代臨床評估。</p>`,'遊戲結束。總分 '+adj+' 分。'+band);
  $('#cp').addEventListener('click',guard(()=>copyText(recText(rec))));$('#again').addEventListener('click',guard(()=>start(V.key)));$('#home').addEventListener('click',guard(()=>{location.hash='';home()}));$('#recs').addEventListener('click',guard(()=>{location.hash='records';records()}))}
function recText(r){return `螢火蟲夜遊 ${r.vname||''} ${r.stamp}\n受試者 ${r.name}${r.age?'（'+r.age+' 歲）':''}\n總分 ${r.score}/${r.total}\n判讀：${r.band}\n需要進一步腦健康評估的可能性（估計）約 ${Math.round((r.prob||0)*100)}%\n`+(r.sections||[]).map(s=>`${s.name} ${s.got}/${s.max}${s.note?'（'+s.note+'）':''}`).join('\n')+`\n用時 ${r.mins} 分鐘，逾時 ${r.timeouts} 次`}
function copyText(text){navigator.clipboard.writeText(text).then(()=>toast('已複製')).catch(()=>{const ta=document.createElement('textarea');ta.value=text;intro.appendChild(ta);ta.select();toast('請長按複製')})}
let filterV='all';
async function records(){setV(null);state=null;Audio.stop();
  showIntro(`<header><h1>受試者記錄<span>.</span></h1></header><div class="chips" id="chips">${[['all','全部'],['std','標準版'],['senior','樂齡版'],['quick','極速版']].map(([k,l])=>`<button type="button" class="btn ${filterV===k?'picked':''}" data-f="${k}">${l}</button>`).join('')}</div><p class="note" id="rinfo">讀取中…</p><div class="panel" id="rlist"></div><div class="row">${btn('回首頁','primary','home')}</div>`);
  $('#home').addEventListener('click',guard(()=>{location.hash='';home()}));$('#chips').addEventListener('click',guard(e=>{const b=e.target.closest('.btn');if(b){filterV=b.dataset.f;records()}}));
  const {where,list:all}=await loadRecords();const list=filterV==='all'?all:all.filter(r=>r.v===filterV);const info=$('#rinfo');if(!info)return;
  info.textContent=(where==='shared'?'共用試算表的記錄，所有裝置都看得到。':where==='failed'?'試算表連線失敗，只顯示這台裝置的記錄。':'這台裝置的記錄。')+' 共 '+list.length+' 筆。點一筆看分項。';
  $('#rlist').innerHTML=list.length?list.map((r,i)=>`<div class="rec" data-i="${i}"><span class="dot ${esc(r.cls||'')}"></span><span class="n">${esc(r.name||'（未填）')}${r.age?'，'+r.age+' 歲':''}<span class="tag">${esc(r.vname||'')}</span><span class="d">${esc(r.stamp||'')}　${esc(r.band||'')}</span></span><span class="s">${r.score} / ${r.total}${r.prob!=null?'<span class="d">約 '+Math.round(r.prob*100)+'%</span>':''}</span></div>`).join(''):'<p class="note">還沒有記錄。</p>';
  $('#rlist').addEventListener('click',guard(e=>{const el=e.target.closest('.rec');if(el)detail(list[+el.dataset.i])}))}
function detail(r){showIntro(`<header><h1>${esc(r.name||'（未填）')}<span>.</span><span class="tag">${esc(r.vname||'')}</span></h1><p class="note">${esc(r.stamp||'')}${r.age?'　'+r.age+' 歲':''}　${r.edu==='low'?'小學以下':'國中以上'}</p></header>
  <div class="panel"><div class="score">${r.score} <span style="font-size:26px;color:var(--muted)">/ ${r.total}</span></div><div class="band ${esc(r.cls||'')}">${esc(r.band||'')}</div>${r.prob!=null?gaugeHtml(r.prob):''}</div>
  <div class="panel"><table><tr><th>站</th><th></th><th>得分</th></tr>${(r.sections||[]).map(s=>`<tr><td>${esc(s.name)}</td><td class="note">${esc(s.note||'')}</td><td>${s.got} / ${s.max}</td></tr>`).join('')}</table><p class="note">用時 ${r.mins} 分鐘，逾時 ${r.timeouts} 次。要刪除這筆，請直接到 Google 試算表刪除該列。</p></div>
  <div class="row">${btn('複製','','cp')}${btn('回列表','primary','back')}</div>`);
  $('#back').addEventListener('click',guard(records));$('#cp').addEventListener('click',guard(()=>copyText(recText(r))))}
function route(){const h=location.hash.replace('#','');if(h==='records')records();else if(VERSIONS[h])start(h);else home()}
window.addEventListener('beforeunload',e=>{if(state){e.preventDefault();e.returnValue=''}});
window.addEventListener('hashchange',()=>{if(state)return;route()});
route();
})();
</script></body></html>
